# Dongle-specific configuration

# Increase BT TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split keyboard configuration - dongle expects 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# USB CDC debugging - provides serial console over USB
# This will create /dev/tty.usbmodemXXXX on macOS for debugging
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable logging over USB CDC
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y
