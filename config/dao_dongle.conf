# Dongle-specific configuration for Raytac MDBT50Q-CX

# Increase BT TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split keyboard configuration - dongle expects 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# === CRITICAL USB Configuration for Raytac MDBT50Q-CX ===
# Based on ChatGPT recommendations for nRF52840 dongles

# USB Device Stack (explicit enable)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_NRFX=y

# CRITICAL: VBUS detect for Raytac dongles
CONFIG_USB_NRFX_VBUS_DETECT_GPIO=y

# USB VID/PID (Nordic/Raytac standard)
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x521F
CONFIG_USB_DEVICE_MANUFACTURER="Raytac"
CONFIG_USB_DEVICE_PRODUCT="Dao Dongle"

# Clock configuration for USB stability
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# USB CDC for debugging (enable after basic USB works)
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
