# Dongle-specific configuration

# Enable USB logging to debug startup issues
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_DBG=y

# Increase BT TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB device stack
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="ZMK Project"
CONFIG_USB_DEVICE_PRODUCT="Dao Dongle"
CONFIG_USB_DEVICE_VID=0x1d50
CONFIG_USB_DEVICE_PID=0x615e

# Ensure HID is enabled
CONFIG_USB_HID=y

# Split keyboard configuration - dongle expects 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Disable KSCAN since dongle has no physical keys
CONFIG_ZMK_KSCAN=n
