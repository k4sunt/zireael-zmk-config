# Dongle-specific configuration for Raytac MDBT50Q-CX

# Increase BT TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split keyboard configuration - dongle expects 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# USB CDC for debugging (temporary - provides /dev/tty.usbmodem*)
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
