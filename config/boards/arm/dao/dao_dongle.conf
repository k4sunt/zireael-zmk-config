# ---- Split central (dongle) ----
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ---- BLE central ----
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_CENTRAL=y

# ---- USB HID (required for dongle) ----
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB_HID_KEYBOARD=y

# ---- Identity ----
CONFIG_ZMK_KEYBOARD_NAME="dao_dongle"
