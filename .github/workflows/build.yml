on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  create-dfu-package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware

      - name: Install tools
        run: |
          pip3 install nrfutil intelhex

      - name: List downloaded artifacts
        run: |
          echo "=== All files in artifact ==="
          ls -la
          echo ""
          echo "=== All .uf2 files ==="
          ls -la *.uf2

      - name: Convert UF2 to HEX for dongle
        run: |
          # Find the dongle UF2 file
          UF2_FILE=$(ls dao_dongle*.uf2 dao_dongle-*.uf2 2>/dev/null | head -1)

          if [ -z "$UF2_FILE" ]; then
            echo "❌ ERROR: dao_dongle UF2 file not found"
            ls -la
            exit 1
          fi

          echo "Found dongle UF2: $UF2_FILE"

          # Create Python conversion script
          cat > convert_uf2.py << 'EOF'
          import struct
          import sys
          from intelhex import IntelHex

          uf2_file = sys.argv[1]
          print(f"Converting {uf2_file} to HEX...")

          ih = IntelHex()

          with open(uf2_file, 'rb') as f:
              while True:
                  block = f.read(512)
                  if len(block) < 512:
                      break

                  # Parse UF2 block
                  magic_start = struct.unpack('<I', block[0:4])[0]
                  if magic_start != 0x0A324655:  # UF2 magic
                      continue

                  target_addr = struct.unpack('<I', block[12:16])[0]
                  payload_size = struct.unpack('<I', block[16:20])[0]
                  payload = block[32:32+payload_size]

                  # Add to Intel HEX
                  for i, byte in enumerate(payload):
                      ih[target_addr + i] = byte

          # Write HEX file
          hex_file = uf2_file.replace('.uf2', '.hex')
          ih.write_hex_file(hex_file)
          print(f"✅ Created HEX file: {hex_file}")
          EOF

          # Run the conversion
          python3 convert_uf2.py "$UF2_FILE"

          HEX_FILE="${UF2_FILE%.uf2}.hex"
          echo "HEX_FILE=$HEX_FILE" >> $GITHUB_ENV

      - name: Create Nordic DFU package
        run: |
          echo "Creating DFU package from: $HEX_FILE"

          nrfutil pkg generate \
            --hw-version 52 \
            --sd-req 0x00,0xB6 \
            --application-version 1 \
            --application "$HEX_FILE" \
            dao_dongle-zmk_dfu.zip

          echo "✅ Created DFU package: dao_dongle-zmk_dfu.zip"
          ls -lh dao_dongle-zmk_dfu.zip

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: dao_dongle-dfu
          path: dao_dongle-zmk_dfu.zip
