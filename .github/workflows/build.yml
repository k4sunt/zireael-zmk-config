on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  create-dfu-package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ALL artifacts to debug
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Install tools
        run: |
          pip3 install nrfutil intelhex

      - name: List ALL downloaded artifacts
        run: |
          echo "=== All artifacts downloaded ==="
          ls -la all-artifacts/
          echo ""
          echo "=== Contents of each artifact ==="
          for dir in all-artifacts/*/; do
            echo ">>> Artifact: $(basename $dir)"
            ls -la "$dir"
            echo ""
          done
          echo "=== Searching for dongle files ==="
          find all-artifacts -name "*dongle*" -type f
          echo ""
          echo "=== All UF2 files ==="
          find all-artifacts -name "*.uf2" -type f

      - name: Copy firmware files to working directory
        run: |
          # Copy all firmware files to current directory for processing
          find all-artifacts -name "*.uf2" -exec cp {} . \;
          echo "=== UF2 files in working directory ==="
          ls -la *.uf2

      - name: Convert UF2 to HEX for dongle
        run: |
          # Find the dongle UF2 file
          UF2_FILE=$(ls dao_dongle*.uf2 dao_dongle-*.uf2 2>/dev/null | head -1)

          if [ -z "$UF2_FILE" ]; then
            echo "❌ ERROR: dao_dongle UF2 file not found"
            ls -la
            exit 1
          fi

          echo "Found dongle UF2: $UF2_FILE"

          # Convert using our Python script
          python3 .github/scripts/uf2_to_hex.py "$UF2_FILE"

          HEX_FILE="${UF2_FILE%.uf2}.hex"
          echo "HEX_FILE=$HEX_FILE" >> $GITHUB_ENV

      - name: Create Nordic DFU package
        run: |
          echo "Creating DFU package from: $HEX_FILE"

          nrfutil pkg generate \
            --hw-version 52 \
            --sd-req 0x00,0xB6 \
            --application-version 1 \
            --application "$HEX_FILE" \
            dao_dongle-zmk_dfu.zip

          echo "✅ Created DFU package: dao_dongle-zmk_dfu.zip"
          ls -lh dao_dongle-zmk_dfu.zip

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: dao_dongle-dfu
          path: dao_dongle-zmk_dfu.zip
