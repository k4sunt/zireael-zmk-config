on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  create-dfu-package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware

      - name: Install nrfutil
        run: |
          pip3 install nrfutil

      - name: Create Nordic DFU package for dongle
        run: |
          if [ -f "dao_dongle.hex" ]; then
            nrfutil pkg generate \
              --hw-version 52 \
              --sd-req 0x00,0xB6 \
              --application-version 1 \
              --application dao_dongle.hex \
              dao_dongle-zmk_dfu.zip
            echo "Created DFU package: dao_dongle-zmk_dfu.zip"
          else
            echo "Error: dao_dongle.hex not found"
            ls -la
            exit 1
          fi

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: dao_dongle-dfu
          path: dao_dongle-zmk_dfu.zip
