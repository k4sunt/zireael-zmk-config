on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  create-dfu-package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ALL artifacts to debug
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Install tools
        run: |
          pip3 install adafruit-nrfutil

      - name: List ALL downloaded artifacts
        run: |
          echo "=== All artifacts downloaded ==="
          ls -la all-artifacts/
          echo ""
          echo "=== Contents of each artifact ==="
          for dir in all-artifacts/*/; do
            echo ">>> Artifact: $(basename $dir)"
            ls -la "$dir"
            echo ""
          done
          echo "=== Searching for dongle files ==="
          find all-artifacts -name "*dongle*" -type f

      - name: Copy dongle HEX file
        run: |
          # Dongle now outputs HEX directly (CONFIG_BUILD_OUTPUT_HEX=y)
          # UF2 files are for keyboards with Adafruit bootloader
          HEX_FILE=$(find all-artifacts -name "dao_dongle*.hex" -o -name "dao_dongle-*.hex" | head -1)

          if [ -z "$HEX_FILE" ]; then
            echo "❌ ERROR: dao_dongle HEX file not found"
            echo "Available files:"
            find all-artifacts -type f
            exit 1
          fi

          echo "Found dongle HEX: $HEX_FILE"
          cp "$HEX_FILE" .
          HEX_FILENAME=$(basename "$HEX_FILE")
          echo "HEX_FILE=$HEX_FILENAME" >> $GITHUB_ENV
          ls -lh "$HEX_FILENAME"

      - name: Create Nordic DFU package
        run: |
          echo "Creating DFU package from: $HEX_FILE"

          adafruit-nrfutil dfu genpkg \
            --dev-type 0x0052 \
            --application "$HEX_FILE" \
            dao_dongle-zmk_dfu.zip

          echo "✅ Created DFU package: dao_dongle-zmk_dfu.zip"
          ls -lh dao_dongle-zmk_dfu.zip

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: dao_dongle-dfu
          path: dao_dongle-zmk_dfu.zip
